services:
  db:
    image: postgres:17-alpine
    container_name: calculadora-faltas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calculadora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calculadora_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-calculadora_faltas}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-calculadora} -d $${POSTGRES_DB:-calculadora_faltas}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

